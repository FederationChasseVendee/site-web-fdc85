name: Editor validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  editor-validation:
    name: Editor validation
    runs-on: ubuntu-latest
    env:
      ASTRO_SITE: https://fdc85.maury.app
      ASTRO_BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test editor
        run: npm run test:editor
      - name: Test analytics
        run: npm run test:analytics
      - name: Build
        run: npm run build
