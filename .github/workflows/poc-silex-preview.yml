name: POC Silex preview artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Validate and package isolated preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate static export
        run: node poc-silex/scripts/check-static.mjs

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc-silex-static-preview
          path: poc-silex/export
          if-no-files-found: error
          retention-days: 14
